<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalSeva - Marketplace</title>
    <!-- Modern Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Design System -->
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <style>
      .filters-bar {
        background: var(--surface);
        padding: var(--space-4);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        margin-bottom: var(--space-6);
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-4);
        align-items: center;
        justify-content: space-between;
      }
      
      .search-box {
        flex: 1;
        min-width: 250px;
        position: relative;
      }
      
      .search-box i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
      }
      
      .search-box input {
        padding-left: 2.5rem;
      }
      
      .filter-controls {
        display: flex;
        gap: var(--space-4);
        flex-wrap: wrap;
      }
      
      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: var(--space-6);
      }
      
      /* Card Overrides for Products */
      .product-description-short {
        color: var(--text-secondary);
        font-size: var(--font-size-sm);
        margin-bottom: var(--space-4);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      
      .card-img-wrapper {
        padding-top: 75%; /* 4:3 Aspect Ratio for products */
      }
    </style>
  </head>
  <body>
    
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="index.html" class="logo">
            <i class="fas fa-hands-helping"></i> LocalSeva
          </a>
          <div class="user-greeting mt-1">Hello, <strong id="userName">User</strong></div>
        </div>
        

        <nav class="sidebar-nav">
          <a href="services.html"><i class="fas fa-wrench"></i> Find Services</a>
          <a href="mart.html" class="active"><i class="fas fa-store"></i> Marketplace</a>
          <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
          <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
        </nav>
        
        <div class="sidebar-footer">
          <button class="btn btn-outline btn-block logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="page-header">
          <div class="flex items-center gap-4">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
              <i class="fas fa-bars"></i>
            </button>
            <h1>Marketplace</h1>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary btn-sm" onclick="openModal('addProductModal')">
              <i class="fas fa-plus"></i> Add Item
            </button>
            <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
              <i class="fas fa-moon"></i>
            </button>
          </div>
        </header>
        
        <div class="page-body">
          <!-- Filters Bar -->
          <div class="filters-bar animate-fade-in">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" id="productSearch" class="form-control" placeholder="Search products...">
            </div>
            
            <div class="filter-controls">
              <select id="categoryFilter" class="form-control" style="min-width: 150px;">
                <option value="">All Categories</option>
                <option value="FURNITURE">Furniture</option>
                <option value="ELECTRONICS">Electronics</option>
                <option value="VEHICLES">Vehicles</option>
                <option value="REAL_ESTATE">Real Estate</option>
                <option value="HOME_APPLIANCES">Home Appliances</option>
                <option value="CLOTHING">Clothing & Accessories</option>
                <option value="BOOKS">Books & Media</option>
                <option value="SPORTS">Sports Equipment</option>
                <option value="OTHER">Other</option>
              </select>
              
              <select id="conditionFilter" class="form-control" style="min-width: 150px;">
                <option value="">Any Condition</option>
                <option value="NEW">New</option>
                <option value="LIKE_NEW">Like New</option>
                <option value="GOOD">Good</option>
                <option value="FAIR">Fair</option>
                <option value="POOR">Poor</option>
              </select>
              
              <button id="clearFilters" class="btn btn-secondary">
                <i class="fas fa-times"></i> Clear
              </button>
            </div>
          </div>
          
          <!-- Products Grid -->
          <div id="productsContainer" class="products-grid">
            <!-- Skeletons will be injected here by JS, then cards -->
          </div>
        </div>
      </main>
      
      <!-- Bottom Navigation for Mobile -->
      <nav class="bottom-nav">
        <a href="services.html"><i class="fas fa-wrench"></i><span>Services</span></a>
        <a href="mart.html" class="active"><i class="fas fa-store"></i><span>Mart</span></a>
        <!-- Add Sell floating button -->
        <a href="#" onclick="openModal('addProductModal')" class="sell-btn" title="Add Product">
          <i class="fas fa-plus"></i><span>Sell</span>
        </a>
        <a href="dashboard.html"><i class="fas fa-chart-line"></i><span>Dash</span></a>
        <a href="profile.html"><i class="fas fa-user-circle"></i><span>Profile</span></a>
      </nav>
    </div>
    
    <!-- Add Product Modal -->
    <div class="modal-overlay" id="addProductModal">
      <div class="modal" style="max-width: 600px;">
        <div class="modal-header">
          <h3 class="modal-title">List an Item</h3>
          <button class="modal-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
          <form id="addProductForm">
            <div class="form-group">
              <label class="form-label required" for="title">Title</label>
              <input type="text" id="title" class="form-control" required placeholder="What are you selling?">
            </div>
            
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-4);">
              <div class="form-group">
                <label class="form-label required" for="price">Price (₹)</label>
                <input type="number" id="price" class="form-control" required min="0" step="1">
              </div>
              <div class="form-group">
                <label class="form-label required" for="condition">Condition</label>
                <select id="condition" class="form-control" required>
                  <option value="NEW">New</option>
                  <option value="LIKE_NEW">Like New</option>
                  <option value="GOOD">Good</option>
                  <option value="FAIR">Fair</option>
                  <option value="POOR">Poor</option>
                </select>
              </div>
            </div>
            
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-4);">
              <div class="form-group">
                <label class="form-label required" for="category">Category</label>
                <select id="category" class="form-control" required>
                  <option value="FURNITURE">Furniture</option>
                  <option value="ELECTRONICS">Electronics</option>
                  <option value="VEHICLES">Vehicles</option>
                  <option value="REAL_ESTATE">Real Estate</option>
                  <option value="HOME_APPLIANCES">Home Appliances</option>
                  <option value="CLOTHING">Clothing & Accessories</option>
                  <option value="BOOKS">Books & Media</option>
                  <option value="SPORTS">Sports Equipment</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label required" for="city">City/Area</label>
                <input type="text" id="city" class="form-control" required placeholder="e.g. Kandivali">
              </div>
            </div>
            
            <div class="form-group">
              <label class="form-label required" for="address">Pickup Address</label>
              <textarea id="address" class="form-control" required rows="2" placeholder="Full address where buyer can pick up the item..."></textarea>
            </div>
            
            <div class="form-group">
              <label class="form-label required" for="description">Description</label>
              <textarea id="description" class="form-control" required rows="3" placeholder="Describe the item, its features, and any defects..."></textarea>
            </div>
            
            <h4 class="font-medium mb-3 mt-4" style="border-bottom: 1px solid var(--border); padding-bottom: 8px;">Product Images</h4>
            
            <div class="form-group">
              <label class="form-label" for="main_image">Main Image</label>
              <input type="file" id="main_image" class="form-control" accept="image/*">
            </div>
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-4);">
              <div class="form-group">
                <label class="form-label" for="image_2">Image 2 (optional)</label>
                <input type="file" id="image_2" class="form-control" accept="image/*">
              </div>
              <div class="form-group">
                <label class="form-label" for="image_3">Image 3 (optional)</label>
                <input type="file" id="image_3" class="form-control" accept="image/*">
              </div>
            </div>
            
            <h4 class="font-medium mb-3 mt-4" style="border-bottom: 1px solid var(--border); padding-bottom: 8px;">Contact Information</h4>
            
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-4);">
              <div class="form-group">
                <label class="form-label" for="contact_phone">Phone Number</label>
                <input type="text" id="contact_phone" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label" for="contact_whatsapp">WhatsApp Number</label>
                <input type="text" id="contact_whatsapp" class="form-control">
              </div>
            </div>
            
            <div class="flex justify-end gap-3 mt-6">
              <button type="button" class="btn btn-secondary modal-close-btn">Cancel</button>
              <button type="submit" class="btn btn-primary" id="submitProductBtn">List Item</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/mart.js"></script>
  </body>
</html>
