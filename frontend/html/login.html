<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalSeva - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        /* Subtle teal-tinted gradient — not too heavy */
        background: linear-gradient(145deg, #01242f 0%, #03353f 50%, #01242f 100%);
        padding: 1.5rem;
      }

      .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border-radius: 1.25rem;
        box-shadow: 0 24px 60px rgba(0,0,0,0.35);
        overflow: hidden;
        animation: fadeIn 0.4s ease both;
      }

      .auth-header {
        text-align: center;
        padding: 2.25rem 2rem 1.5rem;
      }

      .auth-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.625rem;
        margin-bottom: 0.75rem;
      }
      .auth-logo-icon {
        width: 38px; height: 38px;
        background: linear-gradient(135deg, var(--teal-500) 0%, var(--teal-800) 100%);
        border-radius: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1rem;
        box-shadow: 0 4px 12px rgba(13,143,168,0.35);
      }
      .auth-logo-text {
        font-size: 1.375rem;
        font-weight: 800;
        color: var(--teal-900);
        letter-spacing: -0.5px;
      }

      .auth-subtitle {
        color: var(--text-muted);
        font-size: 0.8125rem;
        margin: 0;
      }

      .auth-body {
        padding: 0.25rem 2rem 1.75rem;
      }

      .auth-footer {
        text-align: center;
        padding: 1rem 2rem;
        background: var(--bg-alt);
        border-top: 1px solid var(--border);
        font-size: 0.8125rem;
        color: var(--text-secondary);
      }

      .forgot-link {
        display: block;
        text-align: right;
        font-size: 0.75rem;
        font-weight: 600;
        margin-bottom: 1.25rem;
        color: var(--primary);
      }
      .forgot-link:hover { text-decoration: underline; }

      .demo-accounts {
        margin-top: 1.25rem;
        padding: 0.875rem 1rem;
        background: var(--primary-subtle);
        border-radius: 0.75rem;
        border: 1px solid var(--primary-light);
      }
      .demo-accounts h4 {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .demo-btns { display: flex; gap: 0.5rem; }
      .demo-btns .btn { flex: 1; font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <div class="auth-logo-icon"><i class="fas fa-hands-helping"></i></div>
          <span class="auth-logo-text">LocalSeva</span>
        </div>
        <p class="auth-subtitle">Welcome back! sign in to your account</p>
      </div>

      <div class="auth-body">
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label required" for="username">Username</label>
            <div style="position: relative;">
              <i class="fas fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events:none;"></i>
              <input type="text" id="username" class="form-control" style="padding-left: 2.5rem;" placeholder="Enter your username" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label required" for="password">Password</label>
            <div style="position: relative;">
              <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events:none;"></i>
              <input type="password" id="password" class="form-control" style="padding-left: 2.5rem; padding-right: 2.75rem;" placeholder="••••••••" required />
              <button type="button" title="Toggle password visibility" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); background: transparent; border: none; cursor: pointer; padding: 0.25rem; display: flex; align-items: center; justify-content: center; transition: color 0.2s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'" onclick="const p = document.getElementById('password'); const i = this.querySelector('i'); if (p.type === 'password') { p.type = 'text'; i.classList.replace('fa-eye', 'fa-eye-slash'); } else { p.type = 'password'; i.classList.replace('fa-eye-slash', 'fa-eye'); }">
                <i class="fas fa-eye" style="font-size: 1.1rem;"></i>
              </button>
            </div>
          </div>

          <a href="#" class="forgot-link" onclick="openModal('forgotPasswordModal')">Forgot password?</a>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Sign In &nbsp;<i class="fas fa-arrow-right"></i>
          </button>
        </form>

        <div class="demo-accounts">
          <h4><i class="fas fa-flask"></i> Demo Accounts</h4>
          <div class="demo-btns">
            <button class="btn btn-secondary btn-sm" onclick="document.getElementById('username').value='pooja_iyer'; document.getElementById('password').value='Test@1234';">
              <i class="fas fa-user-tie"></i> Provider
            </button>
            <button class="btn btn-secondary btn-sm" onclick="document.getElementById('username').value='aarav_shah'; document.getElementById('password').value='Test@1234';">
              <i class="fas fa-user"></i> Client
            </button>
          </div>
        </div>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one now</a>
      </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal-overlay" id="forgotPasswordModal">
      <div class="modal">
        <div class="modal-header">
          <div>
            <h3 class="modal-title" id="fpModalTitle">Reset Password</h3>
            <p class="text-muted" id="fpModalSubtitle" style="font-size: var(--font-size-sm); margin-bottom: 0;">Enter your email to receive a reset OTP</p>
          </div>
          <button class="modal-close" id="fpCloseBtn"><i class="fas fa-times"></i></button>
        </div>

        <div class="modal-body">
          <!-- Step 1: Email -->
          <div id="fpStep1" class="tab-pane active">
            <div id="fpStep1Msg" class="form-error mb-2"></div>
            <form id="fpEmailForm">
              <div class="form-group">
                <label class="form-label" for="fpEmail">Email Address</label>
                <input type="email" id="fpEmail" class="form-control" placeholder="your@email.com" required>
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="fpEmailBtn">
                <i class="fas fa-paper-plane"></i> Send OTP
              </button>
            </form>
          </div>

          <!-- Step 2: OTP & New Password -->
          <div id="fpStep2" class="tab-pane">
            <div id="fpStep2Msg" class="form-error mb-2"></div>
            <form id="fpResetForm">
              <div class="form-group">
                <label class="form-label" for="fpOtp">Enter OTP Code</label>
                <input type="text" id="fpOtp" class="form-control" placeholder="123456" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="fpNewPassword">New Password</label>
                <input type="password" id="fpNewPassword" class="form-control" placeholder="Minimum 8 characters" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="fpConfirmPassword">Confirm Password</label>
                <input type="password" id="fpConfirmPassword" class="form-control" placeholder="Confirm new password" required>
              </div>

              <div class="flex gap-2">
                <button type="button" class="btn btn-secondary flex-1" id="fpBackToStep1">
                  <i class="fas fa-arrow-left"></i> Back
                </button>
                <button type="submit" class="btn btn-success flex-1" id="fpResetBtn">
                  <i class="fas fa-lock"></i> Reset Password
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
